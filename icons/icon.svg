<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Vibrant Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Download Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-8%" y="-8%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.32" />
    </filter>

    <filter id="badgeShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <clipPath id="photoClip">
      <rect x="20" y="20" width="248" height="172" rx="14" />
    </clipPath>
  </defs>

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="38" y="38" width="436" height="436" rx="94" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />

  <!-- Stacked Photos Container -->
  <g transform="translate(112, 108)">
    <!-- Back Card (Tilted) -->
    <rect x="16" y="2" width="272" height="200" rx="20" fill="#93C5FD" fill-opacity="0.4" transform="rotate(-7 140 100)" />
    
    <!-- Front Card Base -->
    <rect x="8" y="8" width="272" height="200" rx="20" fill="#FFFFFF" filter="url(#badgeShadow)" />
    
    <!-- Photo Inner Area -->
    <g transform="translate(8, 8)" clip-path="url(#photoClip)">
      <!-- Sky Background -->
      <rect x="20" y="20" width="248" height="172" fill="#F0F7FF" />
      <!-- Golden Sun -->
      <circle cx="212" cy="62" r="20" fill="url(#sunGrad)" />
      <!-- Background Mountains -->
      <path d="M20 192 L96 98 L160 165 L208 114 L268 192 Z" fill="url(#mountGrad1)" />
      <!-- Foreground Mountains -->
      <path d="M84 192 L155 120 L220 192 Z" fill="url(#mountGrad2)" fill-opacity="0.9" />
    </g>
  </g>

  <!-- Download Badge Circle -->
  <circle cx="364" cy="364" r="72" fill="url(#badgeGrad)" filter="url(#badgeShadow)" />
  <circle cx="364" cy="364" r="70" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.5" />

  <!-- Download Arrow -->
  <g transform="translate(364, 364)">
    <line x1="0" y1="-30" x2="0" y2="12" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <polyline points="-20,-4 0,16 20,-4" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-26" y1="30" x2="26" y2="30" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
