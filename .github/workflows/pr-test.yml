name: CI / PR Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify JavaScript Syntax
        run: npm run lint

      - name: Run Integrity & Unit Tests
        run: npm test

  build-and-package:
    name: Package Extension Build
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Extension Distribution
        run: npm run package

      - name: Upload Packaged Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-downloader-build
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
