name: Bug Report
description: Report a broken site, incorrect image extraction, or download error
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue!
  - type: input
    id: url
    attributes:
      label: Target URL
      description: The webpage where the issue occurred.
      placeholder: https://example.com/gallery
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false
